<!DOCTYPE HTML>
<html lang="cs">
	<head>
		<title>Dronaut | Profesionální mapování a GIS analýzy</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="templates/story/assets/css/main.css" />
		<noscript><link rel="stylesheet" href="templates/story/assets/css/noscript.css" /></noscript>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Geo&display=swap" rel="stylesheet" />
		<style>
			/* --- písmo --- */
			body, input, select, textarea, button {
				font-family: 'Space Grotesk', sans-serif !important;
			}

			/* --- tmavé téma --- */
			body { background-color: #1e2132; }
			#wrapper { background-color: #1e2132; }
			#wrapper.divided > * + * { border-color: rgba(255,255,255,0.06); }
			body, p { color: rgba(255,255,255,0.78); }
			h1, h2, h3, h4 { color: #ffffff; }
			a { color: rgba(255,255,255,0.65); }
			a:hover { color: #ffffff; }

			/* banner */
			section.banner { background-color: #252840; }
			section.banner h1 {
				color: #ffffff;
				font-family: 'Geo', sans-serif !important;
				font-size: 6.5rem !important;
			}
			section.banner p.major { color: rgba(255,255,255,0.9); }
			section.banner p:not(.major) { color: rgba(255,255,255,0.7); }
			section.banner .content p.major {
				position: relative;
				padding-bottom: 1.4em;
			}
			section.banner .content p.major::after {
				content: '';
				position: absolute;
				bottom: 0;
				left: 50%;
				transform: translateX(-50%);
				width: 100%;
				height: 2px;
				background: #FF4500;
				border-radius: 2px;
			}

			/* topnav */
			#topnav {
				position: fixed;
				top: 0; left: 0; right: 0;
				z-index: 1000;
				background: #1a1c2a;
				border-bottom: 1px solid rgba(255,255,255,0.08);
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 2.5rem;
				height: 3.5rem;
			}
			#topnav .logo {
				font-weight: 700;
				font-size: 1em;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: #ffffff;
				text-decoration: none;
			}
			#topnav ul { list-style: none; margin: 0; padding: 0; display: flex; }
			#topnav ul li {
				border-left: 1px solid rgba(255,255,255,0.08);
				padding: 0 1.5rem;
			}
			#topnav ul li:last-child { border-right: 1px solid rgba(255,255,255,0.08); }
			#topnav ul a {
				font-size: 0.8em;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: #ffffff !important;
				text-decoration: none;
				transition: color 0.2s;
			}
			#topnav ul a:hover { color: #FF4500 !important; }

			#topnav-burger {
				display: none;
				background: none !important;
				border: none;
				outline: none;
				-webkit-appearance: none;
				font-size: 1.5em;
				cursor: pointer;
				color: #ffffff !important;
				padding: 0;
				line-height: 1;
			}
			#topnav-burger,
			#topnav-burger:focus,
			#topnav-burger:focus-visible,
			#topnav-burger:hover { outline: none; box-shadow: none !important; }

			@media (max-width: 768px) {
				#topnav ul#topnav-links {
					display: none;
					flex-direction: column;
					position: absolute;
					top: 3.5rem; left: 0; right: 0;
					background: #1a1c2a;
					border-bottom: 1px solid rgba(255,255,255,0.08);
					padding: 0.5rem 0;
				}
				#topnav ul#topnav-links.open { display: flex; }
				#topnav-links li {
					border-left: none; border-right: none;
					border-top: 1px solid rgba(255,255,255,0.06);
					padding: 0.8rem 2.5rem;
				}
				#topnav-links li:last-child { border-right: none; }
				#topnav-burger { display: block; }
			}

			/* spotlighty — střídající se tmavé tóny */
			.spotlight:nth-child(odd)  { background-color: #272a3e; }
			.spotlight:nth-child(even) { background-color: #2c2f4a; }
			.spotlight .content h2,
			.spotlight .content p { color: rgba(255,255,255,0.85); }
			.spotlight .content h2 { color: #FF4500; }

			/* wrapper sekce */
			.wrapper.style1             { background-color: #242738; }
			.wrapper.style1 h2          { color: #FF4500 !important; }
			.wrapper.style1 h3          { color: #ffffff; }
			.wrapper.style1 p,
			.wrapper.style1 strong      { color: rgba(255,255,255,0.78); }
			footer.wrapper.style1       { background-color: #1a1c2a; }

			/* dělicí čáry v items gridu */
			.wrapper.style1 .items section { border-color: rgba(255,255,255,0.1); }
			.wrapper.style1 .items         { border-color: rgba(255,255,255,0.1); }

			/* kruhy */
			.circle-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.75rem;
				padding: 1.5rem 1rem;
				align-self: center;
				flex: 0 0 auto;
				width: 35%;
				min-width: 22rem;
				box-sizing: border-box;
			}
			.circle-grid img {
				width: 100%;
				aspect-ratio: 1;
				border-radius: 50%;
				object-fit: cover;
				display: block;
				box-shadow: 0 2px 14px rgba(0,0,0,0.5);
			}
			@media screen and (max-width: 980px) {
				.circle-grid {
					width: 50%;
					min-width: 0;
				}
			}
			@media screen and (max-width: 736px) {
				.circle-grid {
					width: 100%;
					padding: 1rem 2rem 2rem;
				}
			}

			/* Reference – gallery dark téma */
			#references { background-color: #191c2e; }
			.gallery .ref-placeholder {
				background: linear-gradient(160deg, #161929 0%, #1c2242 100%);
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 16rem;
				text-decoration: none;
			}
			.gallery .ref-placeholder .icon {
				font-size: 4rem;
				color: #ffffff;
				opacity: 0.65;
			}
			.gallery article {
				display: flex;
				flex-direction: column;
			}
			.gallery article .caption {
				position: static !important;
				opacity: 1 !important;
				pointer-events: auto !important;
				background-color: rgba(12, 15, 30, 0.95);
				padding: 1.5rem !important;
			}
			.gallery article .caption h3 { color: #ffffff; }
			.gallery article .caption p { color: rgba(255,255,255,0.75); }
			.gallery article .caption .button {
				color: #ffffff !important;
				box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45) !important;
				background: none !important;
			}
			.gallery article .caption .button:hover {
				background-color: rgba(255,255,255,0.1) !important;
			}

			/* accent čára pod nadpisem */
			.spotlight .content h2 {
				position: relative;
				padding-bottom: 0.65em;
			}
			.spotlight .content h2::after {
				content: '';
				position: absolute;
				bottom: 0; left: 0;
				width: 2.8em;
				height: 3px;
				background: #FF4500;
				border-radius: 2px;
			}

			/* kontakt – tlačítka outline s červenou */
			#contact .button {
				box-shadow: inset 0 0 0 1px #FF4500 !important;
				color: #FF4500 !important;
				background: none !important;
			}
			#contact .button:hover {
				background-color: rgba(255,69,0,0.1) !important;
			}

			/* mobil – dropdown menu nad obsahem stránky */
			@media (max-width: 768px) {
				#topnav ul#topnav-links {
					z-index: 1001;
				}
			}

			/* Hero – mobile responsivita */
			@media screen and (max-width: 736px) {
				section.banner.fullscreen {
					min-height: auto;
				}
				section.banner.fullscreen .content {
					min-height: auto !important;
				}
				section.banner .content {
					padding: 6rem 2rem 4rem !important;
				}
				section.banner h1 {
					font-size: 5.5rem !important;
					line-height: 1.1;
				}
				section.banner p.major {
					font-size: 1.3rem !important;
					line-height: 1.5;
				}
				section.banner p:not(.major) {
					font-size: 1.05rem !important;
				}
			}
		</style>


	</head>
	<body class="is-preload">
		<nav id="topnav">
			<a href="#" class="logo" data-content="intro.heading">DRONAUT</a>
			<ul id="topnav-links">
				<li><a href="#services" class="scrolly" data-content="nav.services">Služby</a></li>
				<li><a href="#references" class="scrolly" data-content="nav.references">Reference</a></li>
				<li><a href="#about" class="scrolly" data-content="nav.about">O nás</a></li>
				<li><a href="#contact" class="scrolly" data-content="nav.contact">Kontakt</a></li>
			</ul>
			<button id="topnav-burger" aria-label="Menu">&#9776;</button>
		</nav>

		<div id="wrapper" class="divided">

			<!-- Banner -->
			<section class="banner style1 orient-center content-align-center fullscreen onload-content-fade-up">
				<div class="content">
					<h1 data-content="intro.heading" style="font-weight: 900;">DRONAUT</h1>
					<p class="major" data-content="intro.subheading" style="font-weight: 700;"></p>
					<p data-content="intro.text"></p>
				</div>
			</section>

			<!-- Služby — spotlighty -->
			<div id="services" data-array="services" data-template="spotlight"></div>

			<!-- Reference -->
			<section class="wrapper style1 align-center" id="references">
				<div class="inner">
					<h2 data-content="references.heading">Naše realizace</h2>
				</div>
				<div class="gallery style2 medium onscroll-fade-in" data-array="references.projects" data-template="reference"></div>
			</section>

			<!-- O nás -->
			<section class="wrapper style1 align-center" id="about">
				<div class="inner">
					<h2>O nás</h2>
					<p data-content="about.text"></p>
					<div class="items style1 medium onscroll-fade-in" data-array="about.founders" data-template="founder"></div>
					<div class="items style1 medium onscroll-fade-in" data-array="about.pillars" data-template="pillar"></div>
				</div>
			</section>

			<!-- Kontakt -->
			<section class="wrapper style1 align-center" id="contact">
				<div class="inner medium">
					<h2 data-content="contact.heading">Pojďme se sejít</h2>
					<p data-content="contact.intro"></p>
					<ul class="actions special">
						<li><a href="#" class="button large" data-content="contact.email">info@drnt.cz</a></li>
						<li><a href="#" class="button large" data-content="contact.phone"></a></li>
					</ul>
				</div>
			</section>

			<!-- Footer -->
			<footer class="wrapper style1 align-center">
				<div class="inner">
					<p data-content="footer.copyright"></p>
				</div>
			</footer>

		</div>

		<!-- Scripts -->
		<script src="templates/story/assets/js/jquery.min.js"></script>
		<script src="templates/story/assets/js/jquery.scrollex.min.js"></script>
		<script src="templates/story/assets/js/jquery.scrolly.min.js"></script>
		<script src="templates/story/assets/js/browser.min.js"></script>
		<script src="templates/story/assets/js/breakpoints.min.js"></script>
		<script src="templates/story/assets/js/util.js"></script>
		<script src="templates/story/assets/js/main.js"></script>
		<script>
		fetch('content.json')
			.then(r => r.json())
			.then(c => {
				const get = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);

				document.querySelectorAll('[data-content]').forEach(el => {
					const val = get(c, el.dataset.content);
					if (val !== undefined) el.innerHTML = Array.isArray(val) ? val.join(', ') : val;
				});

				const templates = {
					spotlight: (item, i) => {
						const imgSection = Array.isArray(item.images)
							? `<div class="circle-grid">${item.images.map(src => `<img src="${src}" alt="" />`).join('')}</div>`
							: `<div class="image"><img src="${item.image}" alt="${item.alt || ''}" /></div>`;
						return `
						<section class="spotlight style1 orient-${i % 2 === 0 ? 'right' : 'left'} content-align-left image-position-center onscroll-image-fade-in">
							<div class="content">
								<h2>${item.title}</h2>
								<p>${item.text}</p>
							</div>
							${imgSection}
						</section>`;
					},
					reference: item => `
						<article>
							<a class="image ref-placeholder">
								<span class="icon solid fa-${item.icon}"></span>
							</a>
							<div class="caption">
								<h3>${item.client}</h3>
								<p>${item.task}</p>
								<ul class="actions fixed">
									<li><span class="button small">${item.tag}</span></li>
								</ul>
							</div>
						</article>`,
					founder: item => `
						<section>
							<span class="icon solid style2 major fa-${item.icon}"></span>
							<h3>${item.name}</h3>
							<p><em>${item.role}</em></p>
							<p>${item.bio}</p>
						</section>`,
					pillar: item => `
						<section>
							<span class="icon solid style2 major fa-${item.icon}"></span>
							<h3>${item.title}</h3>
							<p>${item.text}</p>
						</section>`,
				};

				document.querySelectorAll('[data-array]').forEach(el => {
					const items = get(c, el.dataset.array);
					const tmpl = templates[el.dataset.template];
					if (Array.isArray(items) && tmpl) {
						const html = items.map(tmpl).join('');
						const inner = el.querySelector(':scope > .inner');
						(inner || el).insertAdjacentHTML('beforeend', html);
					}
				});

				document.title = c.meta.title;
			});

			// Hamburger menu
			const burger = document.getElementById('topnav-burger');
			const links = document.getElementById('topnav-links');
			burger.addEventListener('click', () => links.classList.toggle('open'));
			links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
		</script>

	</body>
</html>
