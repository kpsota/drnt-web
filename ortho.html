<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Přesměrování | DRONAUT</title>
  <script>
    // Old URL -> new location under /data/ (keeps ?model=/?ortho= ids and #hash)
    var q = location.search.replace(/^\?(model|ortho)=/, '?id=');
    var h = location.hash && !q ? '?id=' + location.hash.slice(1) : '';
    location.replace('/data/ortho/' + (q || h));
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/data/"></noscript>
</head>
<body><a href="/data/">Katalog dat</a></body>
</html>
