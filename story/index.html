<!DOCTYPE HTML>
<html lang="cs">
	<head>
		<title>Dronaut | Profesionální mapování a GIS analýzy</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Geo&display=swap" rel="stylesheet" />
		<script>
			(function () {
				var pid = new URLSearchParams(window.location.search).get('palette');
				if (!pid || !/^[0-9a-fA-F]{24}$/.test(pid)) return;
				pid = pid.toLowerCase();

				function toRgb(h) {
					return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
				}
				function toHex(r,g,b) {
					return [r,g,b].map(function(v){
						return Math.min(255,Math.max(0,Math.round(v))).toString(16).padStart(2,'0');
					}).join('');
				}
				function darken(h,t) { var c=toRgb(h); return toHex(c[0]*(1-t),c[1]*(1-t),c[2]*(1-t)); }
				function mix(h1,h2,t) {
					var a=toRgb(h1),b=toRgb(h2);
					return toHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
				}

				/* paleta: c1=tmavé pozadí, c2=sekundární pozadí, c3=accent, c4=text */
				var c1=pid.slice(0,6), c2=pid.slice(6,12), c3=pid.slice(12,18), c4=pid.slice(18,24);
				var R = document.documentElement.style;
				function set(k,v){ R.setProperty(k,v); }

				set('--bg',            '#'+c1);
				set('--bg-dark',       '#'+darken(c1,0.12));
				set('--bg-banner',     '#'+mix(c1,c2,0.4));
				set('--bg-spot-odd',   '#'+mix(c1,c2,0.55));
				set('--bg-spot-even',  '#'+mix(c1,c2,0.7));
				set('--bg-section',    '#'+mix(c1,c2,0.6));
				set('--bg-ref',        '#'+darken(c1,0.06));
				set('--bg-ref-card',   '#'+darken(c1,0.20));
				set('--bg-grad-start', '#'+darken(c1,0.25));
				set('--bg-grad-end',   '#'+c2);
				set('--accent',        '#'+c3);
				set('--text',          '#'+c4);
				set('--text-rgb',      toRgb(c4).join(', '));
				set('--accent-rgb',    toRgb(c3).join(', '));
			})();
		</script>
		<style>
			/* --- CSS proměnné – výchozí paleta --- */
			:root {
				--bg:             #1e2132;
				--bg-dark:        #1a1c2a;
				--bg-banner:      #252840;
				--bg-spot-odd:    #272a3e;
				--bg-spot-even:   #2c2f4a;
				--bg-section:     #242738;
				--bg-ref:         #191c2e;
				--bg-ref-card:    #12141e;
				--bg-grad-start:  #161929;
				--bg-grad-end:    #1c2242;
				--accent:         #FF4500;
				--text:           #ffffff;
				--text-rgb:       255, 255, 255;
				--accent-rgb:     255, 69, 0;
			}

			/* --- písmo --- */
			body, input, select, textarea, button {
				font-family: 'Space Grotesk', sans-serif !important;
			}

			/* --- tmavé téma --- */
			body { background-color: var(--bg); }
			#wrapper { background-color: var(--bg); }
			#wrapper.divided > * + * { border-color: rgba(var(--text-rgb), 0.06); }
			body, p { color: rgba(var(--text-rgb), 0.78); }
			h1, h2, h3, h4 { color: var(--text); }
			a { color: rgba(var(--text-rgb), 0.65); }
			a:hover { color: var(--text); }

			/* banner */
			section.banner { background-color: var(--bg-banner); }
			section.banner h1 {
				color: var(--text);
				font-family: 'Geo', sans-serif !important;
				font-size: 6.5rem !important;
			}
			section.banner p.major { color: rgba(var(--text-rgb), 0.9); }
			section.banner p:not(.major) { color: rgba(var(--text-rgb), 0.7); }
			section.banner .content p.major {
				position: relative;
				padding-bottom: 1.4em;
			}
			section.banner .content p.major::after {
				content: '';
				position: absolute;
				bottom: 0;
				left: 50%;
				transform: translateX(-50%);
				width: 100%;
				height: 2px;
				background: var(--accent);
				border-radius: 2px;
			}

			/* topnav */
			#topnav {
				position: fixed;
				top: 0; left: 0; right: 0;
				z-index: 1000;
				background: var(--bg-dark);
				border-bottom: 1px solid rgba(var(--text-rgb), 0.08);
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 0 2.5rem;
				height: 3.5rem;
			}
			#topnav .logo {
				font-weight: 700;
				font-size: 1em;
				letter-spacing: 0.15em;
				text-transform: uppercase;
				color: var(--text);
				text-decoration: none;
			}
			#topnav ul { list-style: none; margin: 0; padding: 0; display: flex; }
			#topnav ul li {
				border-left: 1px solid rgba(var(--text-rgb), 0.08);
				padding: 0 1.5rem;
			}
			#topnav ul li:last-child { border-right: 1px solid rgba(var(--text-rgb), 0.08); }
			#topnav ul a {
				font-size: 0.8em;
				font-weight: 700;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: var(--text) !important;
				text-decoration: none;
				transition: color 0.2s;
			}
			#topnav ul a:hover { color: var(--accent) !important; }

			#topnav-burger {
				display: none;
				background: none !important;
				border: none;
				outline: none;
				-webkit-appearance: none;
				font-size: 1.5em;
				cursor: pointer;
				color: var(--text) !important;
				padding: 0;
				line-height: 1;
			}
			#topnav-burger,
			#topnav-burger:focus,
			#topnav-burger:focus-visible,
			#topnav-burger:hover { outline: none; box-shadow: none !important; }

			@media (max-width: 768px) {
				#topnav ul#topnav-links {
					display: none;
					flex-direction: column;
					position: absolute;
					top: 3.5rem; left: 0; right: 0;
					background: var(--bg-dark);
					border-bottom: 1px solid rgba(var(--text-rgb), 0.08);
					padding: 0.5rem 0;
				}
				#topnav ul#topnav-links.open { display: flex; }
				#topnav-links li {
					border-left: none; border-right: none;
					border-top: 1px solid rgba(var(--text-rgb), 0.06);
					padding: 0.8rem 2.5rem;
				}
				#topnav-links li:last-child { border-right: none; }
				#topnav-burger { display: block; }
			}

			/* spotlighty — střídající se tmavé tóny */
			.spotlight:nth-child(odd)  { background-color: var(--bg-spot-odd); }
			.spotlight:nth-child(even) { background-color: var(--bg-spot-even); }
			.spotlight .content h2,
			.spotlight .content p { color: rgba(var(--text-rgb), 0.85); }
			.spotlight .content h2 { color: var(--accent); }

			/* wrapper sekce */
			.wrapper.style1             { background-color: var(--bg-section); }
			.wrapper.style1 h2          { color: var(--accent) !important; }
			.wrapper.style1 h3          { color: var(--text); }
			.wrapper.style1 p,
			.wrapper.style1 strong      { color: rgba(var(--text-rgb), 0.78); }
			footer.wrapper.style1       { background-color: var(--bg-dark); }

			/* dělicí čáry v items gridu */
			.wrapper.style1 .items section { border-color: rgba(var(--text-rgb), 0.1); }
			.wrapper.style1 .items         { border-color: rgba(var(--text-rgb), 0.1); }

			/* kruhy */
			.circle-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: 0.75rem;
				padding: 1.5rem 1rem;
				align-self: center;
				flex: 0 0 auto;
				width: 35%;
				min-width: 22rem;
				box-sizing: border-box;
			}
			.circle-grid img {
				width: 100%;
				aspect-ratio: 1;
				border-radius: 50%;
				object-fit: cover;
				display: block;
				box-shadow: 0 2px 14px rgba(0,0,0,0.5);
			}
			@media screen and (max-width: 980px) {
				.circle-grid {
					width: 50%;
					min-width: 0;
				}
			}
			@media screen and (max-width: 736px) {
				.circle-grid {
					width: 100%;
					padding: 1rem 2rem 2rem;
				}
			}

			/* Reference – gallery dark téma */
			#references { background-color: var(--bg-ref); }
			#references .gallery { gap: 1rem; padding: 0 2rem 2rem; }
			#references .gallery article {
				overflow: hidden;
				display: flex;
				flex-direction: column;
				background: var(--bg-ref-card);
				border-radius: 4px;
			}
			#references .gallery .ref-icon {
				display: flex;
				align-items: center;
				justify-content: center;
				background: linear-gradient(160deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
				min-height: 11rem;
				flex-shrink: 0;
			}
			#references .gallery .ref-icon .icon {
				font-size: 4rem;
				color: var(--text);
				opacity: 0.65;
			}
			#references .gallery .ref-body {
				padding: 1.5rem;
				flex: 1;
				display: flex;
				flex-direction: column;
			}
			#references .gallery .ref-body h3 { color: var(--text); margin-bottom: 0.5rem; }
			#references .gallery .ref-body p { color: rgba(var(--text-rgb), 0.75); flex: 1; }
			#references .gallery .ref-body .actions { justify-content: center; }
			#references .gallery .ref-body .button {
				color: var(--text) !important;
				box-shadow: inset 0 0 0 1px rgba(var(--text-rgb), 0.45) !important;
				background: none !important;
			}
			#references .gallery .ref-body .button:hover {
				background-color: rgba(var(--text-rgb), 0.1) !important;
			}

			/* accent čára pod nadpisem */
			.spotlight .content h2 {
				position: relative;
				padding-bottom: 0.65em;
			}
			.spotlight .content h2::after {
				content: '';
				position: absolute;
				bottom: 0; left: 0;
				width: 2.8em;
				height: 3px;
				background: var(--accent);
				border-radius: 2px;
			}

			/* kontakt – tlačítka outline s červenou */
			#contact .button {
				box-shadow: inset 0 0 0 1px var(--accent) !important;
				color: var(--accent) !important;
				background: none !important;
			}
			#contact .button:hover {
				background-color: rgba(var(--accent-rgb), 0.1) !important;
			}

			/* mobil – dropdown menu nad obsahem stránky */
			@media (max-width: 768px) {
				#topnav ul#topnav-links {
					z-index: 1001;
				}
			}

			/* Hero – mobile responsivita */
			@media screen and (max-width: 736px) {
				section.banner.fullscreen {
					min-height: auto;
				}
				section.banner.fullscreen .content {
					min-height: auto !important;
				}
				section.banner .content {
					padding: 6rem 2rem 4rem !important;
				}
				section.banner h1 {
					font-size: 5.5rem !important;
					line-height: 1.1;
				}
				section.banner p.major {
					font-size: 1.3rem !important;
					line-height: 1.5;
				}
				section.banner p:not(.major) {
					font-size: 1.05rem !important;
				}
			}
		</style>


	</head>
	<body class="is-preload">
		<nav id="topnav">
			<a href="#" class="logo" data-content="intro.heading">DRONAUT</a>
			<ul id="topnav-links">
				<li><a href="#services" class="scrolly" data-content="nav.services">Služby</a></li>
				<li><a href="#references" class="scrolly" data-content="nav.references">Reference</a></li>
				<li><a href="#about" class="scrolly" data-content="nav.about">O nás</a></li>
				<li><a href="#contact" class="scrolly" data-content="nav.contact">Kontakt</a></li>
			</ul>
			<button id="topnav-burger" aria-label="Menu">&#9776;</button>
		</nav>

		<div id="wrapper" class="divided">

			<!-- Banner -->
			<section class="banner style1 orient-center content-align-center fullscreen onload-content-fade-up">
				<div class="content">
					<h1 data-content="intro.heading" style="font-weight: 900;">DRONAUT</h1>
					<p class="major" data-content="intro.subheading" style="font-weight: 700;"></p>
					<p data-content="intro.text"></p>
				</div>
			</section>

			<!-- Služby — spotlighty -->
			<div id="services" data-array="services" data-template="spotlight"></div>

			<!-- Reference -->
			<section class="wrapper style1 align-center" id="references">
				<div class="inner">
					<h2 data-content="references.heading">Naše realizace</h2>
				</div>
				<div class="gallery style2 medium onscroll-fade-in" data-array="references.projects" data-template="reference"></div>
			</section>

			<!-- O nás -->
			<section class="wrapper style1 align-center" id="about">
				<div class="inner">
					<h2>O nás</h2>
					<p data-content="about.text"></p>
					<div class="items style1 medium onscroll-fade-in" data-array="about.founders" data-template="founder"></div>
					<div class="items style1 medium onscroll-fade-in" data-array="about.pillars" data-template="pillar"></div>
				</div>
			</section>

			<!-- Kontakt -->
			<section class="wrapper style1 align-center" id="contact">
				<div class="inner medium">
					<h2 data-content="contact.heading">Pojďme se sejít</h2>
					<p data-content="contact.intro"></p>
					<ul class="actions special">
						<li><a href="#" class="button large" data-content="contact.email">info@drnt.cz</a></li>
						<li><a href="#" class="button large" data-content="contact.phone"></a></li>
					</ul>
				</div>
			</section>

			<!-- Footer -->
			<footer class="wrapper style1 align-center">
				<div class="inner">
					<p data-content="footer.copyright"></p>
				</div>
			</footer>

		</div>

		<!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.scrollex.min.js"></script>
		<script src="assets/js/jquery.scrolly.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>
		<script>
		fetch('content.json')
			.then(r => r.json())
			.then(c => {
				const get = (obj, path) => path.split('.').reduce((o, k) => o?.[k], obj);

				document.querySelectorAll('[data-content]').forEach(el => {
					const val = get(c, el.dataset.content);
					if (val !== undefined) el.innerHTML = Array.isArray(val) ? val.join(', ') : val;
				});

				const templates = {
					spotlight: (item, i) => {
						const imgSection = Array.isArray(item.images)
							? `<div class="circle-grid">${item.images.map(src => `<img src="${src}" alt="" />`).join('')}</div>`
							: `<div class="image"><img src="${item.image}" alt="${item.alt || ''}" /></div>`;
						return `
						<section class="spotlight style1 orient-${i % 2 === 0 ? 'right' : 'left'} content-align-left image-position-center onscroll-image-fade-in">
							<div class="content">
								<h2>${item.title}</h2>
								<p>${item.text}</p>
							</div>
							${imgSection}
						</section>`;
					},
					reference: item => `
						<article>
							<div class="ref-icon">
								<span class="icon solid fa-${item.icon}"></span>
							</div>
							<div class="ref-body">
								<h3>${item.client}</h3>
								<p>${item.task}</p>
								<ul class="actions fixed">
									<li><span class="button small">${item.tag}</span></li>
								</ul>
							</div>
						</article>`,
					founder: item => `
						<section>
							<span class="icon solid style2 major fa-${item.icon}"></span>
							<h3>${item.name}</h3>
							<p><em>${item.role}</em></p>
							<p>${item.bio}</p>
						</section>`,
					pillar: item => `
						<section>
							<span class="icon solid style2 major fa-${item.icon}"></span>
							<h3>${item.title}</h3>
							<p>${item.text}</p>
						</section>`,
				};

				document.querySelectorAll('[data-array]').forEach(el => {
					const items = get(c, el.dataset.array);
					const tmpl = templates[el.dataset.template];
					if (Array.isArray(items) && tmpl) {
						const html = items.map(tmpl).join('');
						const inner = el.querySelector(':scope > .inner');
						(inner || el).insertAdjacentHTML('beforeend', html);
					}
				});

				document.title = c.meta.title;
			});

			// Hamburger menu
			const burger = document.getElementById('topnav-burger');
			const links = document.getElementById('topnav-links');
			burger.addEventListener('click', () => links.classList.toggle('open'));
			links.querySelectorAll('a').forEach(a => a.addEventListener('click', () => links.classList.remove('open')));
		</script>

	</body>
</html>
