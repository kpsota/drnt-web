<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Ortofoto | DRONAUT</title>
  <meta name="description" content="Seznam a interaktivní prohlížeč ortofotomap (GeoTIFF) | DRONAUT">
  <link rel="icon" type="image/png" href="/images/logos/logo-mint.png">

  <!-- Tailwind CSS & Icons & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.3.1/ol.css">

  <link rel="stylesheet" href="/css/ortho.css">
</head>

<body class="h-full bg-[#0d0e11] text-white">

  <!-- 2. MAP VIEWER -->
  <div id="viewer-view" class="fixed inset-0 z-20 flex flex-col bg-[#0d0e11] text-white select-none hidden">
    <header class="px-4 sm:px-6 py-2.5 sm:py-3 z-30 flex items-center justify-between border-b border-white/10 shrink-0 bg-[#0d0e11]/90 backdrop-blur-md">
      <div class="flex items-center gap-2 sm:gap-4">
        <button onclick="window.showCatalog()" class="flex items-center gap-2 text-xs font-mono text-gray-300 hover:text-white px-3 py-1.5 rounded-xl border border-white/10 hover:border-[#cff245]/40 bg-white/[0.03] hover:bg-[#cff245]/10 transition duration-200" title="Zpět na seznam ortofot">
          <i class="bi bi-list-ul text-[#cff245]"></i>
          <span class="hidden sm:inline">Katalog dat</span>
          <span class="sm:hidden">Katalog</span>
        </button>
        <div class="h-4 w-[1px] bg-white/10 hidden md:block"></div>
        <a href="/" class="items-center gap-2.5 group hidden md:flex">
          <span class="font-bold text-base tracking-tight leading-none text-white">DRONAUT</span>
          <span class="text-[9px] text-gray-400 tracking-[0.18em] font-mono uppercase">ORTOFOTO</span>
        </a>
      </div>

      <div class="flex items-center bg-black/40 border border-white/10 px-3 py-1.5 rounded-xl font-mono text-xs shadow-inner">
        <i class="bi bi-map text-[#cff245] mr-2 text-xs"></i>
        <select id="viewer-ortho-select" onchange="window.selectOrtho(this.value)" class="bg-transparent text-gray-200 text-xs font-mono focus:outline-none cursor-pointer pr-1"></select>
      </div>

      <a href="/" class="flex items-center gap-2 text-xs font-mono text-gray-300 hover:text-white px-3 py-1.5 rounded-xl border border-white/10 hover:border-[#cff245]/40 bg-white/[0.03] hover:bg-[#cff245]/10 transition duration-200">
        <i class="bi bi-arrow-left text-[#cff245]"></i>
        <span class="hidden sm:inline">Hlavní web</span>
        <span class="sm:hidden">Web</span>
      </a>
    </header>

    <main class="relative flex-1 w-full h-full overflow-hidden">
      <div id="map"></div>

      <!-- Loading -->
      <div id="loading-overlay" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-[#0d0e11]/95 backdrop-blur-md transition-opacity duration-500 p-6">
        <div class="hud-card rounded-3xl p-8 max-w-md w-full flex flex-col items-center text-center gap-5 border border-white/10">
          <div class="relative w-16 h-16 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full border-2 border-[#cff245]/20"></div>
            <div id="spinner" class="absolute inset-0 rounded-full border-2 border-[#cff245] border-t-transparent animate-spin"></div>
            <i class="bi bi-map text-2xl text-[#cff245] pulse-glow"></i>
          </div>
          <div class="flex flex-col gap-1.5">
            <h2 id="loading-title" class="text-lg font-bold tracking-tight text-white">Načítání ortofota</h2>
            <p id="loading-subtitle" class="text-xs text-gray-400 font-mono">GeoTIFF</p>
          </div>
          <p id="loading-status" class="text-[11px] font-mono text-gray-400">Čtu metadata GeoTIFF...</p>
          <div id="error-box" class="hidden flex-col items-center gap-3 w-full pt-2 border-t border-red-500/20 text-red-400">
            <span class="text-xs font-mono" id="error-msg">Chyba při načítání ortofota.</span>
            <button onclick="window.retryLoad()" class="px-4 py-1.5 rounded-lg bg-red-500/10 border border-red-500/30 text-xs font-mono text-red-300 hover:bg-red-500/20 transition">Zkusit znovu</button>
          </div>
        </div>
      </div>

      <!-- Info card -->
      <div class="absolute top-4 left-4 z-10 hidden sm:block">
        <div class="hud-card rounded-2xl p-4 max-w-xs flex flex-col gap-2.5">
          <div class="flex items-center justify-between border-b border-white/5 pb-2 gap-3">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-[#cff245] animate-pulse"></span>
              <span id="hud-title" class="text-xs font-bold text-white font-mono tracking-tight">Ortofoto</span>
            </div>
            <span class="text-[9px] font-mono uppercase bg-[#cff245]/10 text-[#cff245] border border-[#cff245]/20 px-1.5 py-0.5 rounded">COG</span>
          </div>
          <div class="flex flex-col gap-1 text-[11px] font-mono text-gray-400">
            <div class="flex justify-between gap-4"><span class="text-gray-500">Lokalita:</span><span id="hud-loc" class="text-gray-200">–</span></div>
            <div class="flex justify-between gap-4"><span class="text-gray-500">Datum:</span><span id="hud-date" class="text-gray-200">–</span></div>
            <div class="flex justify-between gap-4"><span class="text-gray-500">Rozlišení:</span><span id="hud-gsd" class="text-gray-200">–</span></div>
            <div class="flex justify-between gap-4"><span class="text-gray-500">Velikost:</span><span id="hud-size" class="text-gray-200">–</span></div>
            <div class="flex justify-between gap-4"><span class="text-gray-500">Souřadnice:</span><span id="hud-coords" class="text-gray-200">–</span></div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10 max-w-[95vw]">
        <div class="hud-card rounded-2xl px-3 py-2 flex items-center gap-2 border border-white/10 shadow-2xl">
          <div class="flex items-center gap-2 px-2 text-xs font-mono text-gray-400" title="Průhlednost ortofota">
            <i class="bi bi-transparency"></i>
            <input id="opacity" type="range" min="0" max="100" value="100" class="w-20 sm:w-28">
          </div>
          <button id="btn-reset" class="hud-btn px-3 py-1.5 rounded-xl text-xs font-mono flex items-center gap-2" title="Zobrazit celé ortofoto">
            <i class="bi bi-aspect-ratio"></i><span class="hidden md:inline">Celé ortofoto</span>
          </button>
          <div class="h-4 w-[1px] bg-white/10"></div>
          <button id="btn-measure-dist" class="hud-btn px-3 py-1.5 rounded-xl text-xs font-mono flex items-center gap-2" title="Měření vzdálenosti (dvojklik dokončí)"><i class="bi bi-rulers"></i><span class="hidden md:inline">Vzdálenost</span></button>
          <button id="btn-measure-area" class="hud-btn px-3 py-1.5 rounded-xl text-xs font-mono flex items-center gap-2" title="Měření plochy (dvojklik dokončí)"><i class="bi bi-pentagon"></i><span class="hidden md:inline">Plocha</span></button>
          <button id="btn-measure-clear" class="hud-btn p-2 rounded-xl text-xs" title="Smazat měření"><i class="bi bi-trash3"></i></button>
          <div class="h-4 w-[1px] bg-white/10"></div>
          <button id="btn-zout" class="hud-btn p-2 rounded-xl text-xs" title="Oddálit"><i class="bi bi-dash-lg"></i></button>
          <button id="btn-zin" class="hud-btn p-2 rounded-xl text-xs" title="Přiblížit"><i class="bi bi-plus-lg"></i></button>
          <button id="btn-fullscreen" class="hud-btn p-2 rounded-xl text-xs" title="Celá obrazovka"><i class="bi bi-fullscreen text-sm" id="fullscreen-icon"></i></button>
        </div>
      </div>

      <!-- Cursor coordinates -->
      <div class="absolute bottom-5 left-4 z-10 hidden lg:block">
        <div class="hud-card rounded-xl px-3.5 py-2 text-[10px] font-mono text-gray-400 border border-white/5 pointer-events-none">
          <i class="bi bi-crosshair text-[#cff245] mr-1.5"></i><span id="cursor-coords">–</span>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.3.1/dist/ol.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <script type="module" src="/js/ortho.js"></script>
</body>
</html>
