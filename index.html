  <!-- Plugins -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="plugins/themify/css/themify-icons.css">
  <link rel="stylesheet" href="plugins/counto/animate.css">
  <link rel="stylesheet" href="plugins/aos/aos.css">
  <link rel="stylesheet" href="plugins/owl-carousel/owl.carousel.min.css">
  <link rel="stylesheet" href="plugins/owl-carousel/owl.theme.default.min.css">
  <link rel="stylesheet" href="plugins/magnific-popup/magnific-popup.css">
  <link rel="stylesheet" href="plugins/animated-text/animated-text.css">
  <link rel="stylesheet" href="plugins/fontawesome/css/all.css">

  <link href="css/style.css" rel="stylesheet">
  <link href="css/dronaut.css" rel="stylesheet">
  <script>(function(){
    var DEFAULT='f5f5f576abae303841ff5722';
    var pid=new URLSearchParams(window.location.search).get('palette')||DEFAULT;
    if(!/^[0-9a-fA-F]{24}$/.test(pid))pid=DEFAULT;
    pid=pid.toLowerCase();
    function lum(h){var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;return 0.2126*r+0.7152*g+0.0722*b;}
    function rgba(h,a){var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return'rgba('+r+','+g+','+b+','+a+')';}
    var cols=[pid.slice(0,6),pid.slice(6,12),pid.slice(12,18),pid.slice(18,24)];
    cols.sort(function(a,b){return lum(a)-lum(b);});
    var dk='#'+cols[0], ac='#'+cols[1], bg=cols[2], lt='#'+cols[3];
    var s=document.createElement('style');
    s.textContent=[
      '.text-color{color:'+ac+' !important}',
      '.btn-main{background:'+ac+' !important}',
      '.btn-main:hover{background:'+dk+' !important}',
      '.btn-black:hover{background:'+ac+' !important}',
      'a:hover{color:'+ac+' !important}',
      '.bg-primary{background:'+ac+' !important}',
      '.ref-tag{background:'+ac+' !important}',
      '.team-card{border-left-color:'+ac+' !important}',
      'nav.main-nav{background:'+lt+' !important}',
      '.dronaut-logo{color:'+dk+' !important}',
      '.navbar-nav .nav-link{color:'+dk+' !important}',
      'section.banner{background:'+rgba(bg,0.35)+' !important}',
      'section.portfolio{background:'+rgba(bg,0.18)+' !important}',
      'section.service-home{background:'+rgba(bg,0.1)+' !important}',
      'section#references{background:'+rgba(bg,0.14)+' !important}',
      'section#contact{background:'+rgba(bg,0.22)+' !important}',
      'section.footer{background:'+dk+' !important}',
      'section.footer p,section.footer a{color:'+rgba(cols[3],0.85)+' !important}',
    ].join('');
    document.head.appendChild(s);
  })();</script>
</head>
