<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dronaut | Design Variants</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background: #0a0a0a;
      color: #ccc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    h1 { color: #fff; font-size: 1.4rem; margin-bottom: 0.4rem; letter-spacing: 0.1em; }
    p { font-size: 0.85rem; color: #666; margin-bottom: 2.5rem; }
    .variants {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    a.variant {
      display: block;
      padding: 1rem 1.8rem;
      border: 1px solid #333;
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      transition: border-color 0.2s, color 0.2s;
    }
    a.variant:hover { border-color: #888; color: #fff; }
    a.variant span { display: block; font-size: 0.7rem; color: #555; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <h1>DRONAUT</h1>
  <p>design variants</p>
  <div class="variants">
    <a class="variant" href="custom/">
      custom
      <span>vlastní design</span>
    </a>
    <a class="variant" href="dimension/">
      dimension
      <span>html5up / Dimension</span>
    </a>
    <a class="variant" href="spectral/">
      spectral
      <span>html5up / Spectral</span>
    </a>
    <a class="variant" href="photon/">
      photon
      <span>html5up / Photon</span>
    </a>
    <a class="variant" href="hyperspace/">
      hyperspace
      <span>html5up / Hyperspace</span>
    </a>
  </div>
</body>
</html>
