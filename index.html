<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dronaut | Mapování a průzkum drony</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <!-- <img src="assets/images/drnt_logo_clip.png" alt="DRNT logo" loading="lazy" /> -->
      <div class="logo-wrap">
        <h1 id="logo">Dronaut</h1>
        <span class="logo-badge">DN</span>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-label="Otevřít navigaci">
        <span aria-hidden="true"></span>
      </button>
    </div>

    <h2 id="header-title"></h2>
    <p id="header-description"></p>
    <nav aria-label="Sekce stránky">
      <ul>
        <li><a href="#o-nas">O nás</a></li>
        <li><a href="#sluzby">Služby</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#technologie">Technologie</a></li>
        <li><a href="#pro-koho">Pro koho</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="o-nas">
      <h2 id="onas-title"></h2>
      <p id="onas-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="onas-card1-title"></h3>
          <p id="onas-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="onas-card2-title"></h3>
          <p id="onas-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="onas-card3-title"></h3>
          <p id="onas-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="sluzby">
      <h2 id="sluzby-title"></h2>
      <p id="sluzby-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="sluzby-card1-title"></h3>
          <p id="sluzby-card1-desc1"></p>
          <p id="sluzby-card1-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card2-title"></h3>
          <p id="sluzby-card2-desc1"></p>
          <p id="sluzby-card2-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card3-title"></h3>
          <p id="sluzby-card3-desc1"></p>
          <p id="sluzby-card3-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card4-title"></h3>
          <p id="sluzby-card4-desc1"></p>
          <p id="sluzby-card4-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card5-title"></h3>
          <p id="sluzby-card5-desc1"></p>
          <p id="sluzby-card5-desc2"></p>
        </div>
      </div>
    </section>

    <section id="portfolio">
      <h2 id="portfolio-title"></h2>
      <p id="portfolio-description"></p>
      <div class="gallery" aria-label="Ukázky fotek z letů dronem">
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Ukázka ortofota" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery1"></p>
        </div>
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Ukázka 3D modelu" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery2"></p>
        </div>
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Záběr dronu" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery3"></p>
        </div>
      </div>
      <div class="row">
        <div class="card">
          <h3 id="portfolio-card1-title"></h3>
          <p id="portfolio-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="portfolio-card2-title"></h3>
          <p id="portfolio-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="portfolio-card3-title"></h3>
          <p id="portfolio-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="technologie">
      <h2 id="technologie-title"></h2>
      <p id="technologie-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="technologie-card1-title"></h3>
          <p id="technologie-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="technologie-card2-title"></h3>
          <p id="technologie-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="technologie-card3-title"></h3>
          <p id="technologie-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="pro-koho">
      <h2 id="prokoho-title"></h2>
      <p id="prokoho-description"></p>
      <ul id="prokoho-list">
      </ul>
    </section>

    <section id="cenik">
      <h2 id="cenik-title"></h2>
      <p id="cenik-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="cenik-card1-title"></h3>
          <p id="cenik-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="cenik-card2-title"></h3>
          <p id="cenik-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="cenik-card3-title"></h3>
          <p id="cenik-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="kontakt">
      <h2 id="kontakt-title"></h2>
      <p id="kontakt-description"></p>
      <p id="kontakt-details"></p>
    </section>
  </main>

  <footer>
    <p id="footer-text"></p>
    <div class="footer-links">
      <a href="#o-nas">O nás</a>
      <a href="#sluzby">Služby</a>
      <a href="#kontakt">Kontakt</a>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('nav');

    if (navToggle && nav) {
      navToggle.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('open', !expanded);
      });

      // Close menu after selecting a link (mobile)
      nav.addEventListener('click', (event) => {
        if (event.target.tagName === 'A') {
          navToggle.setAttribute('aria-expanded', 'false');
          nav.classList.remove('open');
        }
      });
    }

    // Load text content dynamically
    function loadText(section) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', `assets/texts/${section}.txt`, true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              console.log(`Loaded ${section}:`, xhr.responseText);
              resolve(xhr.responseText);
            } else {
              console.error(`Error loading ${section}.txt: ${xhr.status}`);
              resolve('');
            }
          }
        };
        xhr.send();
      });
    }

    async function populateContent() {
      // Header
      const headerText = await loadText('header');
      const headerLines = headerText.split('\n\n');
      const headerTitle = document.getElementById('header-title');
      if (headerTitle) headerTitle.textContent = headerLines[0];
      const headerDesc = document.getElementById('header-description');
      if (headerDesc) headerDesc.textContent = headerLines[1];

      // O nás
      const onasText = await loadText('o-nas');
      const onasLines = onasText.split('\n\n');
      document.getElementById('onas-title').textContent = onasLines[0];
      document.getElementById('onas-description').textContent = onasLines[1];
      document.getElementById('onas-card1-title').textContent = onasLines[2];
      document.getElementById('onas-card1-description').textContent = onasLines[3];
      document.getElementById('onas-card2-title').textContent = onasLines[4];
      document.getElementById('onas-card2-description').textContent = onasLines[5];
      document.getElementById('onas-card3-title').textContent = onasLines[6];
      document.getElementById('onas-card3-description').textContent = onasLines[7];

      // Služby
      const sluzbyText = await loadText('sluzby');
      const sluzbyLines = sluzbyText.split('\n\n');
      document.getElementById('sluzby-title').textContent = sluzbyLines[0];
      document.getElementById('sluzby-description').textContent = sluzbyLines[1];
      for (let i = 0; i < 5; i++) {
        const base = 2 + i * 3;
        document.getElementById(`sluzby-card${i+1}-title`).textContent = sluzbyLines[base];
        document.getElementById(`sluzby-card${i+1}-desc1`).textContent = sluzbyLines[base + 1];
        document.getElementById(`sluzby-card${i+1}-desc2`).textContent = sluzbyLines[base + 2];
      }

      // Portfolio
      const portfolioText = await loadText('portfolio');
      const portfolioLines = portfolioText.split('\n\n');
      document.getElementById('portfolio-title').textContent = portfolioLines[0];
      document.getElementById('portfolio-description').textContent = portfolioLines[1];
      document.getElementById('portfolio-gallery1').textContent = portfolioLines[2];
      document.getElementById('portfolio-gallery2').textContent = portfolioLines[3];
      document.getElementById('portfolio-gallery3').textContent = portfolioLines[4];
      document.getElementById('portfolio-card1-title').textContent = portfolioLines[5];
      document.getElementById('portfolio-card1-description').textContent = portfolioLines[6];
      document.getElementById('portfolio-card2-title').textContent = portfolioLines[7];
      document.getElementById('portfolio-card2-description').textContent = portfolioLines[8];
      document.getElementById('portfolio-card3-title').textContent = portfolioLines[9];
      document.getElementById('portfolio-card3-description').textContent = portfolioLines[10];

      // Technologie
      const technologieText = await loadText('technologie');
      const technologieLines = technologieText.split('\n\n');
      document.getElementById('technologie-title').textContent = technologieLines[0];
      document.getElementById('technologie-description').textContent = technologieLines[1];
      for (let i = 0; i < 3; i++) {
        document.getElementById(`technologie-card${i+1}-title`).textContent = technologieLines[2 + i * 2];
        document.getElementById(`technologie-card${i+1}-description`).textContent = technologieLines[3 + i * 2];
      }

      // Pro koho
      const prokohoText = await loadText('pro-koho');
      const prokohoLines = prokohoText.split('\n\n');
      document.getElementById('prokoho-title').textContent = prokohoLines[0];
      document.getElementById('prokoho-description').textContent = prokohoLines[1];
      const listItems = prokohoLines.slice(2).map(line => `<li>${line}</li>`).join('');
      document.getElementById('prokoho-list').innerHTML = listItems;

      // Ceník
      const cenikText = await loadText('cenik');
      const cenikLines = cenikText.split('\n\n');
      document.getElementById('cenik-title').textContent = cenikLines[0];
      document.getElementById('cenik-description').textContent = cenikLines[1];
      for (let i = 0; i < 3; i++) {
        document.getElementById(`cenik-card${i+1}-title`).textContent = cenikLines[2 + i * 2];
        document.getElementById(`cenik-card${i+1}-description`).textContent = cenikLines[3 + i * 2];
      }

      // Kontakt
      const kontaktText = await loadText('kontakt');
      const kontaktLines = kontaktText.split('\n\n');
      document.getElementById('kontakt-title').textContent = kontaktLines[0];
      document.getElementById('kontakt-description').textContent = kontaktLines[1];
      document.getElementById('kontakt-details').innerHTML = kontaktLines[2].replace('Email: ', '<strong>Email:</strong> <a href="mailto:info@drnt.cz">') + '</a><br />' + kontaktLines[3].replace('Telefon: ', '<strong>Telefon:</strong> <a href="tel:+420123456789">') + '</a>';

      // Footer
      const footerText = await loadText('footer');
      document.getElementById('footer-text').innerHTML = `© <span id="year"></span> ${footerText}`;
      document.getElementById('year').textContent = new Date().getFullYear();
    }

    // Load content when page loads
    document.addEventListener('DOMContentLoaded', () => {
      populateContent().catch(error => console.error('Error in populateContent:', error));
    });
  </script>
</body>
</html>
