<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dronaut | Mapování a průzkum drony</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <div class="header-top">
      <div class="logo-wrap">
        <span class="logo-badge"></span>
        <div class="logo-text">
          <h1 id="logo">DRONAUT</h1>
          <p id="logo-url">průzkumníci digitálního světa</p>
        </div>
      </div>
      <button class="nav-toggle" aria-expanded="false" aria-label="Otevřít navigaci">
        <span aria-hidden="true"></span>
      </button>
    </div>

    <h2 id="header-title"></h2>
    <p id="header-description"></p>
    <nav aria-label="Sekce stránky">
      <ul>
        <li><a href="#o-nas">O nás</a></li>
        <li><a href="#sluzby">Služby</a></li>
        <li><a href="#portfolio">Portfolio</a></li>
        <li><a href="#technologie">Technologie</a></li>
        <li><a href="#pro-koho">Pro koho</a></li>
        <li><a href="#kontakt">Kontakt</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="o-nas">
      <h2 id="onas-title"></h2>
      <p id="onas-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="onas-card1-title"></h3>
          <p id="onas-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="onas-card2-title"></h3>
          <p id="onas-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="onas-card3-title"></h3>
          <p id="onas-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="sluzby">
      <h2 id="sluzby-title"></h2>
      <p id="sluzby-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="sluzby-card1-title"></h3>
          <p id="sluzby-card1-desc1"></p>
          <p id="sluzby-card1-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card2-title"></h3>
          <p id="sluzby-card2-desc1"></p>
          <p id="sluzby-card2-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card3-title"></h3>
          <p id="sluzby-card3-desc1"></p>
          <p id="sluzby-card3-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card4-title"></h3>
          <p id="sluzby-card4-desc1"></p>
          <p id="sluzby-card4-desc2"></p>
        </div>
        <div class="card">
          <h3 id="sluzby-card5-title"></h3>
          <p id="sluzby-card5-desc1"></p>
          <p id="sluzby-card5-desc2"></p>
        </div>
      </div>
    </section>

    <section id="portfolio">
      <h2 id="portfolio-title"></h2>
      <p id="portfolio-description"></p>
      <div class="gallery" aria-label="Ukázky fotek z letů dronem">
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Ukázka ortofota" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery1"></p>
        </div>
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Ukázka 3D modelu" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery2"></p>
        </div>
        <div class="gallery-item">
          <img src="assets/images/drnt_logo.png" alt="Záběr dronu" loading="lazy" />
          <p class="gallery-caption" id="portfolio-gallery3"></p>
        </div>
      </div>
      <div class="row">
        <div class="card">
          <h3 id="portfolio-card1-title"></h3>
          <p id="portfolio-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="portfolio-card2-title"></h3>
          <p id="portfolio-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="portfolio-card3-title"></h3>
          <p id="portfolio-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="technologie">
      <h2 id="technologie-title"></h2>
      <p id="technologie-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="technologie-card1-title"></h3>
          <p id="technologie-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="technologie-card2-title"></h3>
          <p id="technologie-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="technologie-card3-title"></h3>
          <p id="technologie-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="pro-koho">
      <h2 id="prokoho-title"></h2>
      <p id="prokoho-description"></p>
      <ul id="prokoho-list">
      </ul>
    </section>

    <section id="cenik">
      <h2 id="cenik-title"></h2>
      <p id="cenik-description"></p>
      <div class="row">
        <div class="card">
          <h3 id="cenik-card1-title"></h3>
          <p id="cenik-card1-description"></p>
        </div>
        <div class="card">
          <h3 id="cenik-card2-title"></h3>
          <p id="cenik-card2-description"></p>
        </div>
        <div class="card">
          <h3 id="cenik-card3-title"></h3>
          <p id="cenik-card3-description"></p>
        </div>
      </div>
    </section>

    <section id="kontakt">
      <h2 id="kontakt-title"></h2>
      <p id="kontakt-description"></p>
      <p id="kontakt-details"></p>
    </section>
  </main>

  <footer>
    <p id="footer-text"></p>
    <div class="footer-links">
      <a href="#o-nas">O nás</a>
      <a href="#sluzby">Služby</a>
      <a href="#kontakt">Kontakt</a>
    </div>
  </footer>

  <script>
    const navToggle = document.querySelector('.nav-toggle');
    const nav = document.querySelector('nav');

    if (navToggle && nav) {
      navToggle.addEventListener('click', () => {
        const expanded = navToggle.getAttribute('aria-expanded') === 'true';
        navToggle.setAttribute('aria-expanded', String(!expanded));
        nav.classList.toggle('open', !expanded);
      });

      // Close menu after selecting a link (mobile)
      nav.addEventListener('click', (event) => {
        if (event.target.tagName === 'A') {
          navToggle.setAttribute('aria-expanded', 'false');
          nav.classList.remove('open');
        }
      });
    }

    // Load all content from a single JSON file
    function loadContent() {
      return new Promise((resolve) => {
        const xhr = new XMLHttpRequest();
        xhr.open('GET', 'assets/texts/content.json', true);
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              resolve(JSON.parse(xhr.responseText));
            } else {
              console.error(`Error loading content.json: ${xhr.status}`);
              resolve({});
            }
          }
        };
        xhr.send();
      });
    }

    async function populateContent() {
      const c = await loadContent();

      // Header
      const headerTitle = document.getElementById('header-title');
      if (headerTitle) headerTitle.textContent = c.header.title;
      const headerDesc = document.getElementById('header-description');
      if (headerDesc) headerDesc.textContent = c.header.description;

      // O nás
      document.getElementById('onas-title').textContent = c.onas.title;
      document.getElementById('onas-description').textContent = c.onas.description;
      c.onas.cards.forEach((card, i) => {
        document.getElementById(`onas-card${i+1}-title`).textContent = card.title;
        document.getElementById(`onas-card${i+1}-description`).textContent = card.description;
      });

      // Služby
      document.getElementById('sluzby-title').textContent = c.sluzby.title;
      document.getElementById('sluzby-description').textContent = c.sluzby.description;
      c.sluzby.cards.forEach((card, i) => {
        document.getElementById(`sluzby-card${i+1}-title`).textContent = card.title;
        document.getElementById(`sluzby-card${i+1}-desc1`).textContent = card.desc1;
        document.getElementById(`sluzby-card${i+1}-desc2`).textContent = card.desc2;
      });

      // Portfolio
      document.getElementById('portfolio-title').textContent = c.portfolio.title;
      document.getElementById('portfolio-description').textContent = c.portfolio.description;
      c.portfolio.gallery.forEach((label, i) => {
        document.getElementById(`portfolio-gallery${i+1}`).textContent = label;
      });
      c.portfolio.cards.forEach((card, i) => {
        document.getElementById(`portfolio-card${i+1}-title`).textContent = card.title;
        document.getElementById(`portfolio-card${i+1}-description`).textContent = card.description;
      });

      // Technologie
      document.getElementById('technologie-title').textContent = c.technologie.title;
      document.getElementById('technologie-description').textContent = c.technologie.description;
      c.technologie.cards.forEach((card, i) => {
        document.getElementById(`technologie-card${i+1}-title`).textContent = card.title;
        document.getElementById(`technologie-card${i+1}-description`).textContent = card.description;
      });

      // Pro koho
      document.getElementById('prokoho-title').textContent = c.prokoho.title;
      document.getElementById('prokoho-description').textContent = c.prokoho.description;
      document.getElementById('prokoho-list').innerHTML = c.prokoho.items.map(item => `<li>${item}</li>`).join('');

      // Ceník
      document.getElementById('cenik-title').textContent = c.cenik.title;
      document.getElementById('cenik-description').textContent = c.cenik.description;
      c.cenik.cards.forEach((card, i) => {
        document.getElementById(`cenik-card${i+1}-title`).textContent = card.title;
        document.getElementById(`cenik-card${i+1}-description`).textContent = card.description;
      });

      // Kontakt
      document.getElementById('kontakt-title').textContent = c.kontakt.title;
      document.getElementById('kontakt-description').textContent = c.kontakt.description;
      document.getElementById('kontakt-details').innerHTML =
        `<strong>Email:</strong> <a href="mailto:${c.kontakt.email}">${c.kontakt.email}</a><br />` +
        `<strong>Telefon:</strong> <a href="tel:${c.kontakt.phone.replace(/\s/g, '')}">${c.kontakt.phone}</a>`;

      // Footer
      document.getElementById('footer-text').innerHTML = `© <span id="year"></span> ${c.footer.text}`;
      document.getElementById('year').textContent = new Date().getFullYear();
    }

    // Load content when page loads
    document.addEventListener('DOMContentLoaded', () => {
      populateContent().catch(error => console.error('Error in populateContent:', error));
    });
  </script>
</body>
</html>
